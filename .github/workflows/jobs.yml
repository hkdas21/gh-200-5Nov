name: Jobs

on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🖥️ Run Greeting Script
        run: |
          chmod +x scripts/greet.sh
          ./scripts/greet.sh

  build:
    runs-on: ubuntu-latest
    needs: setup                    # ← Runs AFTER setup
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔨 Simulate Build
        run: |
          echo "Building the application..."
          echo "Build completed at $(date)" > build-report.txt
          cat build-report.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-report
          path: build-report.txt
          retention-days: 2

  test:
    runs-on: ubuntu-latest
    needs: build                    # ← Runs AFTER build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-report
          
      - name: Inspect Atifact
        run: cat build-report.txt
          
